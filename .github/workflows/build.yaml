name: Build

on:
  push:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Build
        run: cd my-app && npm i && npm run build && mkdir -p deploy/2023 && cp -r build/* deploy/2023/ && cp public/_redirects deploy/ && cp public/_redirects deploy/2023/ && echo "=== deploy root ===" && ls -la deploy && echo "=== deploy/2023 ===" && ls -la deploy/2023 && echo "=== deploy/_redirects ===" && cat deploy/_redirects && echo "=== deploy/2023/_redirects ===" && cat deploy/2023/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: camp-site-2023
          directory: my-app/deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
