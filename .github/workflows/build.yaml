name: Build

on:
  push:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Build
        run: cd my-app && npm i && npm run build && rm -rf deploy && mkdir -p deploy/2023 && cp -r build/* deploy/2023/ && cp public/_redirects deploy/ && rm -f deploy/_routes.json deploy/2023/_routes.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: camp-site-2023
          directory: my-app/deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
